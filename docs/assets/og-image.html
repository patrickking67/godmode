<!doctype html>
<!--
  Source for site/assets/og-image.png (1200x630). Not published with the site.
  Render it with headless Chrome from the repository root:

    chrome --headless=new --hide-scrollbars --window-size=1200,630 \
      --screenshot=site/assets/og-image.png docs/assets/og-image.html
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Godmode social card</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        box-sizing: border-box;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        color: #ececf1;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Helvetica,
          Arial,
          sans-serif;
        background:
          radial-gradient(760px 460px at 92% -8%, rgba(124, 58, 237, 0.38), transparent 65%),
          radial-gradient(640px 440px at -4% 112%, rgba(16, 185, 129, 0.22), transparent 60%),
          #0a0a0f;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 20px;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 40px;
        font-weight: 700;
      }
      .brand img {
        width: 84px;
        height: 84px;
      }
      h1 {
        margin: 0;
        max-width: 960px;
        font-size: 68px;
        line-height: 1.08;
        letter-spacing: -0.03em;
      }
      .row {
        display: flex;
        gap: 16px;
        font-size: 28px;
        color: #d0d0dc;
      }
      .chip {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 22px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        background: rgba(22, 22, 31, 0.8);
      }
      .dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div class="brand"><img src="../../site/assets/favicon.svg" alt="" />godmode</div>
    <h1>Nine coding workflows, written once, built for two engines.</h1>
    <div class="row">
      <span class="chip"><span class="dot" style="background: #c084fc"></span>Claude Code</span>
      <span class="chip"><span class="dot" style="background: #34d399"></span>Codex</span>
      <span class="chip">10 MCP servers, no API keys</span>
    </div>
  </body>
</html>
