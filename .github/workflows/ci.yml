name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build, typecheck, lint, format check and tests, the same command agents run locally.
      - run: pnpm check
      # The build must not change committed output: plugin/ has to match its sources.
      - run: git add -A && git diff --cached --exit-code
      # Coverage runs once, on the newest Node. Thresholds live in vitest.config.ts.
      - name: Coverage
        if: matrix.node == 24
        run: |
          pnpm test:coverage
          {
            echo "### Coverage"
            node -e 'const t=require("./coverage/coverage-summary.json").total;for(const k of ["statements","branches","functions","lines"])console.log("- "+k+": "+t[k].pct+"%")'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          retention-days: 14
